# NOTE: generates CHANGELOG.md and release notes; see https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Redraft. Generated from [Conventional Commits](https://www.conventionalcommits.org) by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]\
    {% if previous.version %}(<REPO>/compare/{{ previous.version }}...{{ version }}){% else %}(<REPO>/commits/{{ version }}){% endif %} \
    - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
trim = true
postprocessors = [{ pattern = "<REPO>", replace = "https://github.com/meatcar/redraft" }]

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^doc", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Testing" },
  { body = ".*security", group = "<!-- 6 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 7 -->◀️ Revert" },
  { message = ".*", group = "<!-- 8 -->⚙️ Maintenance" },
]
topo_order_commits = true
sort_commits = "oldest"
