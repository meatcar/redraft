name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Check CHANGELOG.md matches the tag
        run: |
          nix develop --command git cliff --output CHANGELOG.md
          git diff --exit-code CHANGELOG.md || { echo "::error::Tag with 'bun run release' so CHANGELOG.md is regenerated."; exit 1; }

      - name: Test
        run: nix develop --command bun test

      - name: Build single-file HTML
        run: nix develop --command bun run build:html

      - name: End-to-end test the built HTML
        run: nix develop --command bunx --bun playwright test

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/redraft.html

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix develop --command git cliff --latest --strip all --output notes.md
          gh release create "$GITHUB_REF_NAME" dist/redraft.html --notes-file notes.md --verify-tag

      # NOTE: GITHUB_TOKEN events skip other workflows, except dispatch; github-pages deploys only from main.
      - name: Deploy releases to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
