name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31

      - name: Install dependencies
        run: nix develop --no-write-lock-file --command bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: nix develop --no-write-lock-file --command bun audit --audit-level high

      - name: Check CHANGELOG.md matches the tag
        run: |
          nix develop --no-write-lock-file --command git cliff --output CHANGELOG.md
          git diff --exit-code CHANGELOG.md || { echo "::error::Tag with 'bun run release' so CHANGELOG.md is regenerated."; exit 1; }

      - name: Test
        run: nix develop --command bun test

      - name: Build single-file HTML
        run: nix develop --no-write-lock-file --command bun run build:html

      - name: Generate release notes
        run: nix develop --no-write-lock-file --command git cliff --latest --strip all --output dist/notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redraft
          path: |
            dist/redraft.html
            dist/notes.md
          if-no-files-found: error

  reproduce:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: redraft
          path: candidate
      - name: Compare independent clean rebuilds with the release candidate
        run: bash scripts/reproduce.sh "$GITHUB_SHA" candidate/redraft.html

  release:
    needs: reproduce
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: redraft
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/redraft.html

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/redraft.html --notes-file dist/notes.md --verify-tag

      # NOTE: GITHUB_TOKEN events skip other workflows, except dispatch; github-pages deploys only from main.
      - name: Deploy releases to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
