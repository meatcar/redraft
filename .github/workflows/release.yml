name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Test
        run: nix develop --command bun test

      - name: Build single-file HTML
        run: nix develop --command bun run build:html

      - uses: actions/attest@v4
        with:
          subject-path: dist/redraft.html

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/redraft.html --generate-notes --verify-tag

      # NOTE: GITHUB_TOKEN events skip other workflows, except dispatch; github-pages deploys only from main.
      - name: Deploy releases to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
