name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Every step runs in the devshell: treefmt and the nix formatters live there.
      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Check
        run: nix develop --command bun run check

      - name: Test
        run: nix develop --command bun test

      - name: Check flake
        run: nix flake check

      - name: Build single-file HTML
        run: nix develop --command bun run build:html

      - name: End-to-end test the built HTML
        run: nix develop --command bunx --bun playwright test

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
