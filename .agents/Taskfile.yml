version: "3"

# Keep authentication commands out of logs. Command output is still visible.
silent: true

tasks:
  before_nix:
    desc: Establish access needed for private Nix inputs
    # Only host tools and Task are guaranteed here.
    # No private Nix inputs.
    cmds: []

  setup_auth:
    desc: Establish shared access needed for setup
    # Setup needs no credentials.
    cmds: []

  resume_auth:
    desc: Refresh the current session's credentials
    # No secrets: the API key is entered in the browser.
    cmds: []

  work:
    desc: Prepare the project after authentication
    cmds:
      - task: deps
      - task: prep
      - task: check
      - task: ready

  deps:
    desc: Supply dependencies not provided by Nix
    cmds:
      - bun install --frozen-lockfile

  prep:
    desc: Prepare project data and generated files
    cmds: []

  check:
    desc: Prevent work in an unusable environment
    cmds:
      - bun run typecheck

  ready:
    desc: Hand the prepared project over to its consumers
    cmds:
      - echo "Ready. Start the app with 'amp orb services ensure' (see .amp/services.yaml)."

  setup_cleanup:
    desc: Remove credentials before setup artifacts can be shared
    # Runs on success and failure, without requiring a working devshell.
    # No setup credentials to remove.
    cmds: []
